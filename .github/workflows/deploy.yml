name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.13"
          environment-file: .github/ci_support/environment.yml
          auto-activate-base: false

      - name: Build Jupyter Book
        shell: bash -l {0}
        run: |
          pip install jupyter-book
          printf "format: jb-book\nroot: README\nchapters:\n" > _toc.yml
          for f in $(find . -name "*.ipynb" | sort); do
            echo "- file: ${f#./}" >> _toc.yml
          done
          cat _toc.yml
          jupyter-book build . --path-output public

      - run: mv public/_build/html public_html
      - run: touch public_html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public_html
          clean: true
